name: Release

# Publishes a multi-arch image to Docker Hub when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  - your Docker Hub account/namespace (also the image namespace)
#   DOCKERHUB_TOKEN     - a Docker Hub access token with Read & Write scope
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/line-hf-bot
          # v1.2.3 -> tags 1.2.3, 1.2, and latest. Pre-release tags (v1.2.3-rc1) skip latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
